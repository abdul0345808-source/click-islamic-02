<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Islamic Quiz Game - کلک اسلامی کوئز گیم</title>
    
    <!-- اسٹایل کی فائل کا لنک -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- گیم کا مرکزی کنٹینر -->
    <div id="game-container">
        <header>
            <h1 id="game-title">کلک اسلامی کوئز گیم</h1>
            <div id="level-indicator">لیول: <span id="current-level">1</span></div>
        </header>

        <!-- سوال اور آپشنز کا سیکشن -->
        <main>
            <div id="question-box">
                <p id="question-text">سوال یہاں ظاہر ہوگا...</p>
            </div>

            <div id="options-container">
                <!-- آپشنز کے بٹنز یہاں متحرک طور پر آئیں گے -->
            </div>
        </main>

        <!-- نیویگیشن یا کنٹرولز -->
        <footer>
            <button id="next-btn" style="display:none;">اگلا سوال</button>
        </footer>
    </div>

    <!-- جاوا اسکریپت کی فائل کا لنک -->
    <script src="script.js"></script>
</body>
</html>
